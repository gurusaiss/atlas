name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # Render auto-deploys both services on every push to main once connected
      # to this GitHub repo -- these deploy-hook calls are an optional explicit
      # trigger (useful if auto-deploy is disabled, or to force a redeploy
      # after a secrets-only change that doesn't touch the code).
      - name: Trigger Render backend deploy
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}"

      - name: Trigger Render Celery worker deploy
        if: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}"

      # Render has no CI-triggerable remote shell -- run `alembic upgrade head`
      # via the Render dashboard's Shell tab on atlas-backend after a schema
      # change lands (see docs/DEPLOYMENT.md).

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Report deployment status
        run: |
          if [ "${{ needs.deploy-backend.result }}" = "success" ] && [ "${{ needs.deploy-frontend.result }}" = "success" ]; then
            echo "Deployment succeeded."
          else
            echo "Deployment failed -- check the deploy-backend/deploy-frontend job logs." >&2
            exit 1
          fi
