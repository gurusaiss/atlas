server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real static file falls back to
    # index.html so React Router can handle client-side routes like
    # /repositories/:id/graph on a direct load or page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite -- safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
